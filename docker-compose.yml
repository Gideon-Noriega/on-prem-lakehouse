services:
  # Layer 1: Object Storage
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
      MINIO_DOMAIN: minio
      MINIO_REGION_NAME: us-east-1
    ports:
      - "9002:9000"
      - "9003:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set lakehouse http://minio:9000 admin admin123456 &&
      mc mb lakehouse/warehouse --ignore-existing &&
      mc mb lakehouse/raw --ignore-existing &&
      mc mb lakehouse/staging --ignore-existing &&
      echo Buckets created successfully
      "
    networks:
      - lakehouse

  # Layer 1: Iceberg REST Catalog (backed by PostgreSQL)
  postgres:
    image: postgres:16
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg123
      POSTGRES_DB: iceberg_catalog
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: lakehouse-iceberg-rest
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123456
      AWS_REGION: us-east-1
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg123
    ports:
      - "8181:8181"
    networks:
      - lakehouse

  # Layer 2: Spark Master
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: lakehouse-spark-master
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123456
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8082:8080"
      - "7078:7077"
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./data:/data
    networks:
      - lakehouse
    depends_on:
      - iceberg-rest

  # Layer 2: Spark Worker
  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: lakehouse-spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_CORES: 2
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123456
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./data:/data
    networks:
      - lakehouse
    depends_on:
      - spark-master


  # Layer 3: Trino Query Engine
  trino:
    image: trinodb/trino:435
    container_name: lakehouse-trino
    ports:
      - "8083:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - /home/datastream/testmachine/trino/etc/config.properties:/etc/trino/config.properties:ro
      - /home/datastream/testmachine/trino/etc/jvm.config:/etc/trino/jvm.config:ro
    networks:
      - lakehouse
    depends_on:
      - iceberg-rest

  # Layer 4: dbt Analytics
  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: lakehouse-dbt
    volumes:
      - ./dbt:/dbt
    networks:
      - lakehouse
    depends_on:
      - trino
    profiles:
      - tools

  # Layer 5: Airflow Orchestration
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: lakehouse-airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://iceberg:iceberg123@postgres:5432/iceberg_catalog
      AIRFLOW__CORE__FERNET_KEY: ZmJiMGYwMTFhZjE2NDcyNGIwYjk4YmRiZjk1NTg5MWQ=
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: lakehouse-secret-key
    ports:
      - "8084:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lakehouse
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  minio_data:
  postgres_data:

networks:
  lakehouse:
    driver: bridge
