services:
  # Layer 1: Object Storage
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
      MINIO_DOMAIN: minio
      MINIO_REGION_NAME: us-east-1
    ports:
      - "9002:9000"
      - "9003:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set lakehouse http://minio:9000 admin admin123456 &&
      mc mb lakehouse/warehouse --ignore-existing &&
      mc mb lakehouse/raw --ignore-existing &&
      mc mb lakehouse/staging --ignore-existing &&
      echo 'Buckets created successfully'
      "
    networks:
      - lakehouse

  # Layer 1: PostgreSQL (Hive Metastore backend)
  postgres:
    image: postgres:16
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
      POSTGRES_DB: metastore
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lakehouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Layer 1: Hive Metastore
  hive-metastore:
    image: apache/hive:4.0.1
    container_name: lakehouse-hive-metastore
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive123
    ports:
      - "9083:9083"
    volumes:
      - ./hive-metastore/conf:/opt/hive/conf:ro
    networks:
      - lakehouse

volumes:
  minio_data:
  postgres_data:

networks:
  lakehouse:
    driver: bridge
